<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 854" width="660" height="854">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="854" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="808"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="808"/>
<rect x="48" y="85" width="215" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="101" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Genera coppia di chiavi effimere</text>
<text x="155" y="117" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(ECDH) e un nonce casuale</text>
<line class="arrow-line" x1="155" y1="165" x2="505" y2="165"/>
<polygon points="505,165 497,161 497,169" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="165" r="9"/>
<text class="circle-text" x="177" y="165">1</text>
<text class="arrow-text" x="330" y="160">Client Hello</text>
<rect class="payload-box" x="220" y="173" width="220" height="44"/>
<text class="payload-text" x="330" y="187">Chiave pubblica effimera +</text>
<text class="payload-text" x="330" y="202">nonce client + ciphers TLS 1.3</text>
<rect x="398" y="233" width="215" height="48" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="249" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Genera a sua volta coppia di</text>
<text x="505" y="265" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">chiavi effimere (ECDH) e nonce</text>
<rect x="390" y="295" width="230" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="311" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Combina le chiavi pubbliche (ECDH)</text>
<text x="505" y="327" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">per ottenere il segreto condiviso,</text>
<text x="505" y="343" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">da cui deriva la session key (HKDF)</text>
<rect x="388" y="373" width="235" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="389" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Firma l'intero transcript dello</text>
<text x="505" y="405" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">scambio con la propria chiave privKc</text>
<text x="505" y="421" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e cifra la firma con la session key</text>
<line class="arrow-line" x1="505" y1="469" x2="155" y2="469"/>
<polygon points="155,469 163,465 163,473" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="469" r="9"/>
<text class="circle-text" x="483" y="469">2</text>
<text class="arrow-text" x="330" y="464">Server Hello</text>
<rect class="payload-box" x="203" y="477" width="255" height="44"/>
<text class="payload-text" x="330" y="491">Chiave pubblica effimera + nonce server +</text>
<text class="payload-text" x="330" y="506">certificato (pubKc) + firma cifrata scambio</text>
<rect x="43" y="537" width="225" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="553" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica il certificato del server</text>
<text x="155" y="569" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(pinning su server_conn.crt e SAN)</text>
<rect x="40" y="599" width="230" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="615" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Calcola lo stesso segreto condiviso</text>
<text x="155" y="631" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(ECDH) e deriva la session key (HKDF)</text>
<rect x="38" y="661" width="235" height="64" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="677" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica la firma con la session key</text>
<text x="155" y="693" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e la validità su transcript, confermando</text>
<text x="155" y="709" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">l'autenticità del server</text>
<rect x="18" y="739" width="624" height="32" rx="4" fill="#1e293b"/>
<text x="330" y="755" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Handshake completato: entrambi condividono la stessa session key per il canale cifrato</text>
<rect x="80" y="25" width="150" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="80" y="787" width="150" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="808" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="430" y="25" width="150" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="430" y="787" width="150" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="808" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>