<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 718" width="660" height="718">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="718" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="672"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="672"/>
<rect x="18" y="85" width="624" height="32" rx="4" fill="#9a3412"/>
<text x="330" y="101" font-size="11px" font-weight="bold" fill="#fffbeb" text-anchor="middle" dominant-baseline="central">Caso 1: Quota di Timestamp Esaurita (Utente Charlie, nr = 0)</text>
<line class="arrow-line" x1="155" y1="151" x2="505" y2="151"/>
<polygon points="505,151 497,147 497,155" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="151" r="9"/>
<text class="circle-text" x="177" y="151">1</text>
<text class="arrow-text" x="330" y="146">Richiesta timestamp con crediti esauriti</text>
<rect class="payload-box" x="203" y="159" width="255" height="29"/>
<text class="payload-text" x="330" y="173">{"cmd": "TIMESTAMP", "hash": "h", "seq": 1}</text>
<rect x="380" y="204" width="250" height="48" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="220" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Rileva crediti residui nr == 0 in users.json</text>
<text x="505" y="236" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Rifiuta la richiesta senza scalare crediti</text>
<line class="arrow-line" x1="505" y1="284" x2="155" y2="284"/>
<polygon points="155,284 163,280 163,288" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="284" r="9"/>
<text class="circle-text" x="483" y="284">2</text>
<text class="arrow-text" x="330" y="279">Notifica errore quota esaurita</text>
<rect class="payload-box" x="205" y="292" width="250" height="44"/>
<text class="payload-text" x="330" y="306">{"status": "ERROR",</text>
<text class="payload-text" x="330" y="321">"message": "Timestamp balance exhausted"}</text>
<rect x="50" y="352" width="210" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="368" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Operazione respinta:</text>
<text x="155" y="384" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">nessuna firma o token rilasciato</text>
<rect x="18" y="414" width="624" height="32" rx="4" fill="#991b1b"/>
<text x="330" y="430" font-size="11px" font-weight="bold" fill="#fef2f2" text-anchor="middle" dominant-baseline="central">Caso 2: Tentativo di Replay Attack (Messaggio duplicato o seq già usato)</text>
<line class="arrow-line" x1="155" y1="480" x2="505" y2="480"/>
<polygon points="505,480 497,476 497,484" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="480" r="9"/>
<text class="circle-text" x="177" y="480">3</text>
<text class="arrow-text" x="330" y="475">Replay frame con seq già consumato</text>
<rect class="payload-box" x="203" y="488" width="255" height="29"/>
<text class="payload-text" x="330" y="502">{"cmd": "TIMESTAMP", "hash": "h", "seq": 1}</text>
<rect x="385" y="533" width="240" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="549" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Rileva seq mismatch (1 != expected 2)</text>
<text x="505" y="565" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Segnala violazione di sicurezza</text>
<text x="505" y="581" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Interrompe immediatamente la sessione</text>
<line class="arrow-line" x1="505" y1="629" x2="155" y2="629"/>
<polygon points="155,629 163,625 163,633" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="629" r="9"/>
<text class="circle-text" x="483" y="629">4</text>
<text class="arrow-text" x="330" y="624">[Chiusura immediata della connessione TLS]</text>
<rect x="80" y="25" width="150" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="80" y="651" width="150" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="672" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="430" y="25" width="150" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="430" y="651" width="150" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="672" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>