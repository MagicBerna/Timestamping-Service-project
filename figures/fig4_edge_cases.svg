<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 779" width="660" height="779">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="779" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="733"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="733"/>
<rect x="18" y="85" width="624" height="32" rx="4" fill="#9a3412"/>
<text x="330" y="101" font-size="11px" font-weight="bold" fill="#fffbeb" text-anchor="middle" dominant-baseline="central">Caso 1: Quota di Timestamp Esaurita (Utente Charlie, nr = 0)</text>
<line class="arrow-line" x1="155" y1="151" x2="505" y2="151"/>
<polygon points="505,151 497,147 497,155" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="151" r="9"/>
<text class="circle-text" x="177" y="151">1</text>
<text class="arrow-text" x="330" y="146">Richiesta timestamp con crediti esauriti</text>
<rect class="payload-box" x="200" y="159" width="260" height="44"/>
<text class="payload-text" x="330" y="173">{"cmd": "TIMESTAMP", "hash": "h",</text>
<text class="payload-text" x="330" y="188">"nonce_s": "Ns", "seq": 1}</text>
<rect x="380" y="219" width="250" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="235" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica nonce_s == Ns e seq == 1</text>
<text x="505" y="251" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Rileva crediti residui nr == 0 in users.json</text>
<text x="505" y="267" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Rifiuta la richiesta senza scalare crediti</text>
<line class="arrow-line" x1="505" y1="315" x2="155" y2="315"/>
<polygon points="155,315 163,311 163,319" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="315" r="9"/>
<text class="circle-text" x="483" y="315">2</text>
<text class="arrow-text" x="330" y="310">Notifica errore quota esaurita</text>
<rect class="payload-box" x="195" y="323" width="270" height="59"/>
<text class="payload-text" x="330" y="337">{"status": "ERROR",</text>
<text class="payload-text" x="330" y="352">"message": "Timestamp balance exhausted",</text>
<text class="payload-text" x="330" y="367">"nonce_s": "Ns", "seq": 1}</text>
<rect x="50" y="398" width="210" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="414" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Operazione respinta:</text>
<text x="155" y="430" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">nessuna firma o token rilasciato</text>
<rect x="18" y="460" width="624" height="32" rx="4" fill="#991b1b"/>
<text x="330" y="476" font-size="11px" font-weight="bold" fill="#fef2f2" text-anchor="middle" dominant-baseline="central">Caso 2: Tentativo di Replay Attack (Messaggio duplicato o seq già usato)</text>
<line class="arrow-line" x1="155" y1="526" x2="505" y2="526"/>
<polygon points="505,526 497,522 497,530" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="526" r="9"/>
<text class="circle-text" x="177" y="526">3</text>
<text class="arrow-text" x="330" y="521">Replay frame con seq già consumato</text>
<rect class="payload-box" x="200" y="534" width="260" height="44"/>
<text class="payload-text" x="330" y="548">{"cmd": "TIMESTAMP", "hash": "h",</text>
<text class="payload-text" x="330" y="563">"nonce_s": "Ns", "seq": 1}</text>
<rect x="385" y="594" width="240" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="610" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Rileva seq mismatch (1 != expected 2)</text>
<text x="505" y="626" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Segnala violazione di sicurezza</text>
<text x="505" y="642" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Interrompe immediatamente la sessione</text>
<line class="arrow-line" x1="505" y1="690" x2="155" y2="690"/>
<polygon points="155,690 163,686 163,694" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="690" r="9"/>
<text class="circle-text" x="483" y="690">4</text>
<text class="arrow-text" x="330" y="685">[Chiusura immediata della connessione TLS]</text>
<rect x="80" y="25" width="150" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="80" y="712" width="150" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="733" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client</text>
<rect x="430" y="25" width="150" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="430" y="712" width="150" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="733" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>