<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 808" width="660" height="808">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="808" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="762"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="762"/>
<rect x="18" y="85" width="624" height="32" rx="4" fill="#1e293b"/>
<text x="330" y="101" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Canale sicuro TLS 1.3 attivo - Sessione autenticata (Charlie)</text>
<rect x="33" y="133" width="245" height="64" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="149" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Calcola l'hash SHA-256 del documento</text>
<text x="155" y="165" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(256 bit / 32 Byte = 64 caratteri hex)</text>
<text x="155" y="181" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(Data Minimization: nessun invio file)</text>
<line class="arrow-line" x1="155" y1="229" x2="505" y2="229"/>
<polygon points="505,229 497,225 497,233" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="229" r="9"/>
<text class="circle-text" x="177" y="229">1</text>
<text class="arrow-text" x="330" y="224">Richiesta di timestamp con saldo esaurito</text>
<rect class="payload-box" x="203" y="237" width="255" height="59"/>
<text class="payload-text" x="330" y="251">{"cmd": "TIMESTAMP",</text>
<text class="payload-text" x="330" y="266">"hash": "1b4f68b852...240f5c6b",</text>
<text class="payload-text" x="330" y="281">"nonce_s": "Ns", "seq": 1}</text>
<rect x="388" y="312" width="235" height="48" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="328" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica nonce_s == Ns e seq == 1,</text>
<text x="505" y="344" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">incrementa expected_seq = 2</text>
<rect x="383" y="374" width="245" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="390" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Controllo quota in RAM (g_users):</text>
<text x="505" y="406" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Charlie: nc = 10, nr = 0 (esauriti)</text>
<text x="505" y="422" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Saldo crediti insufficiente!</text>
<rect x="385" y="452" width="240" height="48" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="468" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Nessun calcolo crittografico (privKts),</text>
<text x="505" y="484" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">nessuna modifica su users.json</text>
<line class="arrow-line" x1="505" y1="532" x2="155" y2="532"/>
<polygon points="155,532 163,528 163,536" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="532" r="9"/>
<text class="circle-text" x="483" y="532">2</text>
<text class="arrow-text" x="330" y="527">Rifiuto richiesta per quota esaurita</text>
<rect class="payload-box" x="203" y="540" width="255" height="59"/>
<text class="payload-text" x="330" y="554">{"status": "ERROR",</text>
<text class="payload-text" x="330" y="569">"message": "Timestamp balance exhausted",</text>
<text class="payload-text" x="330" y="584">"nonce_s": "Ns", "seq": 1}</text>
<rect x="33" y="615" width="245" height="64" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="631" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Notifica quota esaurita ricevuta.</text>
<text x="155" y="647" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Nessun token rilasciato o salvato.</text>
<text x="155" y="663" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">L'utente deve acquistare nuovi crediti</text>
<rect x="18" y="693" width="624" height="32" rx="4" fill="#9a3412"/>
<text x="330" y="709" font-size="11px" font-weight="bold" fill="#fffbeb" text-anchor="middle" dominant-baseline="central">Controllo quote applicato: Emissione bloccata in assenza di crediti residui</text>
<rect x="75" y="25" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Charlie</text>
<rect x="75" y="741" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="762" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Charlie</text>
<rect x="425" y="25" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="425" y="741" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="762" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>