<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 639" width="660" height="639">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="639" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="593"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="593"/>
<rect x="18" y="85" width="624" height="32" rx="4" fill="#1e293b"/>
<text x="330" y="101" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Canale sicuro già stabilito (handshake TLS 1.3 completato)</text>
<line class="arrow-line" x1="155" y1="151" x2="505" y2="151"/>
<polygon points="505,151 497,147 497,155" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="151" r="9"/>
<text class="circle-text" x="177" y="151">1</text>
<text class="arrow-text" x="330" y="146">Login (email/username + password)</text>
<rect class="payload-box" x="220" y="159" width="220" height="44"/>
<text class="payload-text" x="330" y="173">{"cmd": "LOGIN", "username": "alice",</text>
<text class="payload-text" x="330" y="188">"password": "..."}</text>
<rect x="393" y="219" width="225" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="235" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica le credenziali in memoria</text>
<text x="505" y="251" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(g_users, caricato da users.json)</text>
<text x="505" y="267" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(confronto SHA-256(pass || salt))</text>
<rect x="393" y="297" width="225" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="313" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Genera nonce server Ns (16B),</text>
<text x="505" y="329" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">inizializza sessione autenticata</text>
<text x="505" y="345" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e contatore expected_seq = 1</text>
<line class="arrow-line" x1="505" y1="393" x2="155" y2="393"/>
<polygon points="155,393 163,389 163,397" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="393" r="9"/>
<text class="circle-text" x="483" y="393">2</text>
<text class="arrow-text" x="330" y="388">Login riuscito</text>
<rect class="payload-box" x="225" y="401" width="210" height="29"/>
<text class="payload-text" x="330" y="415">{"status": "OK", "nonce_s": "Ns"}</text>
<rect x="45" y="446" width="220" height="64" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="462" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Memorizza il nonce Ns,</text>
<text x="155" y="478" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">inizializza contatore seq = 1 e</text>
<text x="155" y="494" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">apre la shell interattiva REPL</text>
<rect x="18" y="524" width="624" height="32" rx="4" fill="#065f46"/>
<text x="330" y="540" font-size="11px" font-weight="bold" fill="#ecfdf5" text-anchor="middle" dominant-baseline="central">Autenticazione riuscita: sessione protetta da attacchi Replay</text>
<rect x="75" y="25" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Alice</text>
<rect x="75" y="572" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="593" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Alice</text>
<rect x="425" y="25" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="425" y="572" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="593" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>