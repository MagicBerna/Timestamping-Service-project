<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 701" width="660" height="701">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="701" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="655"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="655"/>
<rect x="18" y="85" width="624" height="32" rx="4" fill="#1e293b"/>
<text x="330" y="101" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Canale sicuro già stabilito (handshake TLS 1.3 completato)</text>
<rect x="53" y="133" width="205" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="149" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Genera nonce crittografico</text>
<text x="155" y="165" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">del client Nc (16B CSPRNG)</text>
<line class="arrow-line" x1="155" y1="213" x2="505" y2="213"/>
<polygon points="505,213 497,209 497,217" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="213" r="9"/>
<text class="circle-text" x="177" y="213">1</text>
<text class="arrow-text" x="330" y="208">Login (email/username + password)</text>
<rect class="payload-box" x="208" y="221" width="245" height="44"/>
<text class="payload-text" x="330" y="235">{"cmd": "LOGIN", "username": "alice",</text>
<text class="payload-text" x="330" y="250">"password": "...", "nonce_c": "Nc"}</text>
<rect x="393" y="281" width="225" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="297" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica le credenziali in memoria</text>
<text x="505" y="313" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(g_users, caricato da users.json)</text>
<text x="505" y="329" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(confronto SHA-256(pass || salt))</text>
<rect x="393" y="359" width="225" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="375" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Genera nonce server Ns (16B),</text>
<text x="505" y="391" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">inizializza sessione autenticata</text>
<text x="505" y="407" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e contatore expected_seq = 1</text>
<line class="arrow-line" x1="505" y1="455" x2="155" y2="455"/>
<polygon points="155,455 163,451 163,459" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="455" r="9"/>
<text class="circle-text" x="483" y="455">2</text>
<text class="arrow-text" x="330" y="450">Login riuscito</text>
<rect class="payload-box" x="225" y="463" width="210" height="29"/>
<text class="payload-text" x="330" y="477">{"status": "OK", "nonce_s": "Ns"}</text>
<rect x="45" y="508" width="220" height="64" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="524" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Memorizza il nonce Ns,</text>
<text x="155" y="540" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">inizializza contatore seq = 1 e</text>
<text x="155" y="556" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">apre la shell interattiva REPL</text>
<rect x="18" y="586" width="624" height="32" rx="4" fill="#065f46"/>
<text x="330" y="602" font-size="11px" font-weight="bold" fill="#ecfdf5" text-anchor="middle" dominant-baseline="central">Autenticazione riuscita: sessione protetta da attacchi Replay</text>
<rect x="75" y="25" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Alice</text>
<rect x="75" y="634" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="655" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Alice</text>
<rect x="425" y="25" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="425" y="634" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="655" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>