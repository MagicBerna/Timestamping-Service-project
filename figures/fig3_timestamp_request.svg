<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 870" width="660" height="870">
<defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.lifeline { stroke: #cbd5e1; stroke-width: 2; }
.arrow-line { stroke: #1e293b; stroke-width: 1.5; }
.arrow-text { font-size: 12px; font-weight: 500; fill: #0f172a; text-anchor: middle; }
.circle-bg { fill: #1e293b; }
.circle-text { font-size: 10.5px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
.payload-box { fill: #1e293b; stroke: #0f172a; stroke-width: 1; rx: 4; }
.payload-text { font-size: 11px; fill: #f8fafc; text-anchor: middle; dominant-baseline: central; }
</style>
</defs>
<rect width="660" height="870" fill="#ffffff"/>
<line class="lifeline" x1="155" y1="46" x2="155" y2="824"/>
<line class="lifeline" x1="505" y1="46" x2="505" y2="824"/>
<rect x="18" y="85" width="624" height="32" rx="4" fill="#1e293b"/>
<text x="330" y="101" font-size="11px" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Canale sicuro TLS 1.3 attivo - Sessione utente autenticata</text>
<rect x="35" y="133" width="240" height="64" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="149" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Calcola l'hash del documento con</text>
<text x="155" y="165" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">SHA-256 (256 bit / 32 Byte locale)</text>
<text x="155" y="181" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">(Data Minimization: nessun invio file)</text>
<line class="arrow-line" x1="155" y1="229" x2="505" y2="229"/>
<polygon points="505,229 497,225 497,233" fill="#1e293b"/>
<circle class="circle-bg" cx="177" cy="229" r="9"/>
<text class="circle-text" x="177" y="229">1</text>
<text class="arrow-text" x="330" y="224">Richiesta di timestamp sull'hash calcolato</text>
<rect class="payload-box" x="215" y="237" width="230" height="59"/>
<text class="payload-text" x="330" y="251">{"cmd": "TIMESTAMP",</text>
<text class="payload-text" x="330" y="266">"hash": "h_sha256",</text>
<text class="payload-text" x="330" y="281">"nonce_s": "Ns", "seq": 1}</text>
<rect x="383" y="312" width="245" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="328" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica anti-replay/sessione:</text>
<text x="505" y="344" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">nonce_s == Ns e seq == expected_seq,</text>
<text x="505" y="360" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">incrementa expected_seq = 2</text>
<rect x="403" y="390" width="205" height="48" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="406" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica i crediti residui</text>
<text x="505" y="422" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">di Alice in users.json (nr > 0)</text>
<rect x="385" y="452" width="240" height="48" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="468" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Scala un credito ad Alice (nr=99, nc=1)</text>
<text x="505" y="484" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e persiste lo stato su users.json</text>
<rect x="388" y="514" width="235" height="64" rx="4" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
<text x="505" y="530" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Campiona Unix timestamp UTC (t),</text>
<text x="505" y="546" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">costruisce payload canonico (40B)</text>
<text x="505" y="562" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e firma con privKts (ECDSA P-384)</text>
<line class="arrow-line" x1="505" y1="610" x2="155" y2="610"/>
<polygon points="155,610 163,606 163,614" fill="#1e293b"/>
<circle class="circle-bg" cx="483" cy="610" r="9"/>
<text class="circle-text" x="483" y="610">2</text>
<text class="arrow-text" x="330" y="605">Token emesso (hash, time, firma)</text>
<rect class="payload-box" x="215" y="618" width="230" height="59"/>
<text class="payload-text" x="330" y="632">{"status": "OK", "hash": "h",</text>
<text class="payload-text" x="330" y="647">"time": t, "signature": "σ",</text>
<text class="payload-text" x="330" y="662">"nonce_s": "Ns", "seq": 1}</text>
<rect x="38" y="693" width="235" height="48" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="155" y="709" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Verifica immediata del token con pubKts</text>
<text x="155" y="725" font-size="11px" fill="#ffffff" text-anchor="middle" dominant-baseline="central">e salvataggio in token_<h>.json</text>
<rect x="18" y="755" width="624" height="32" rx="4" fill="#065f46"/>
<text x="330" y="771" font-size="11px" font-weight="bold" fill="#ecfdf5" text-anchor="middle" dominant-baseline="central">Token valido: verificabile in futuro da chiunque possieda pubKts</text>
<rect x="75" y="25" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="46" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Alice</text>
<rect x="75" y="803" width="160" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="155" y="824" font-size="13.5px" font-weight="bold" fill="#1e40af" text-anchor="middle" dominant-baseline="central">Client di Alice</text>
<rect x="425" y="25" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="46" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
<rect x="425" y="803" width="160" height="42" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="505" y="824" font-size="13.5px" font-weight="bold" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">Server</text>
</svg>